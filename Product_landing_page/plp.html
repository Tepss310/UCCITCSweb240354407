<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="plp.css" rel="stylesheet"/>
    <title>Burrito Heaven</title>
</head>
<body>

<header id="header">
    <img id="header-img" src="https://cdn.britannica.com/13/234013-050-73781543/rice-and-chorizo-burrito.jpg" alt="Burrito Image">
</header>

<nav id="nav-bar">
    <a class="nav-link" href="#header">Home</a>
    <a class="nav-link" href="#menu">Menu</a>
    <a class="nav-link" href="#footer">Contact</a>
</nav>

<main>
    <section id="video-section">
        <section id="video-section">
    <iframe id="video"
            src="https://player.vimeo.com/video/227637862"
            width="640"
            height="360"
            frameborder="0"
            allowfullscreen>
          </iframe>
</section>

    </section>

    <section id="form-section">
        <form id="form" action="https://www.freecodecamp.com/email-submit">
            <input id="email" name="email" placeholder="Enter your email to get burrito deals" type="email">
            <input id="submit" type="submit" value="Subscribe">
        </form>
    </section>

    <section id="menu">
        <h2>Our Burrito Menu</h2>
        <ul>
            <li>🌯 Beef Burrito</li>
            <li>🌯 Chicken Burrito</li>
            <li>🌯 Veggie Burrito</li>
            <li>🌯 Spicy Fiesta Burrito</li>
        </ul>
    </section>
</main>

<footer id="footer">
    <h3>© 2025 Burrito Heaven</h3>
</footer>

</body>
</html>
